<script>
    const priceElement = document.getElementById("btc-price");

    // Função que busca o preço diretamente da API HTTP da Binance
    async function buscarPrecoBTC() {
        try {
            const resposta = await fetch("https://binance.com");
            
            if (!resposta.ok) throw new Error("Erro na resposta da rede");
            
            const dados = await resposta.json();
            const preco = parseFloat(dados.price);

            // Formata o valor como moeda americana (US$)
            priceElement.innerText = preco.toLocaleString('en-US', {
                style: 'currency',
                currency: 'USD'
            });
            
            // Restaura a cor padrão caso tenha dado erro antes
            priceElement.style.color = "#ffffff";

        } catch (erro) {
            console.error("Erro ao buscar dados da Binance:", erro);
            priceElement.innerText = "Erro ao carregar";
            priceElement.style.color = "#ff4a4a";
        }
    }

    // Executa a função assim que a página abre
    buscarPrecoBTC();

    // Atualiza o preço automaticamente a cada 5 segundos
    setInterval(buscarPrecoBTC, 5000);
</script>
