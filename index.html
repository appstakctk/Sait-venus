<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento Dinâmico</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0c0e; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; gap: 15px; }
        
        .card { background-color: #121316; width: 100%; max-width: 500px; border-radius: 20px; padding: 20px; border: 1px solid #1f2226; }
        .section-title { color: #10b981; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        
        /* Containers para os Widgets Oficiais Legítimos */
        .widget-frame { width: 100%; height: 160px; border: none; border-radius: 12px; background-color: #161c18; }
        .chart-frame { width: 100%; height: 280px; border: none; border-radius: 12px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Bloco 1: Monitoramento da Conta e Saúde Venus Protocol -->
    <div class="card">
        <div class="section-title">Painel Oficial Venus Protocol</div>
        <!-- Incorporação segura da interface oficial de conta do ecossistema Venus -->
        <iframe class="widget-frame" src="https://venus.io"></iframe>
    </div>

    <!-- Bloco 2: Preço do Bitcoin ao Vivo (Ticker Dinâmico da Binance) -->
    <div class="card">
        <div class="section-title">Preço do BTC e Limites Dinâmicos</div>
        <!-- Widget oficial de transmissão de mercado ao vivo da Binance para webmóvel -->
        <iframe class="chart-frame" src="https://binance.com"></iframe>
    </div>

</body>
</html>
