<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Margem/BTCB</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b0e11;
            color: #eaedd1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .container {
            background-color: #161a1e;
            border: 1px solid #474d57;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #fcd535; margin-top: 0; font-size: 22px; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 11px; color: #848e9c; margin-bottom: 25px; font-family: monospace; }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #fcd535;
            color: #0b0e11;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 15px;
        }
        button:hover { background-color: #e2be28; }
        
        .error-banner {
            background-color: rgba(207, 62, 66, 0.15);
            color: #cf3e42;
            border: 1px solid #cf3e42;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
            text-align: center;
        }
        
        .metric { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 15px; border-bottom: 1px solid #2b3139; padding-bottom: 8px; }
        .value { font-weight: bold; font-family: monospace; color: #fff; }
        .status-badge { padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .healthy { background-color: rgba(2, 192, 118, 0.2); color: #02c076; }
        .danger { background-color: rgba(207, 62, 66, 0.2); color: #cf3e42; }

        /* Estilo da caixa de console técnico */
        .debug-panel {
            width: 100%;
            max-width: 440px;
            background-color: #000;
            border: 1px dashed #cf3e42;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 11px;
            color: #ff5555;
            word-break: break-all;
            white-space: pre-wrap;
        }
    </style>
    <!-- Importação estável do Ethers.js -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
</head>
<body>

<div class="container">
    <h2>MONITOR MARGEM/BTCB</h2>
    <div class="subtitle">Leitura On-Chain via Comptroller</div>
    
    <div id="errorBanner" class="error-banner">A conexão de rede falhou. Tentando reconectar...</div>
    
    <button onclick="sincronizarRede()">🔄 Atualizar Agora</button>

    <div class="dashboard">
        <div class="metric">
            <span>Preço do BTC (Spot):</span>
            <span id="btcPrice" class="value">Buscando...</span>
        </div>
        <div class="metric">
            <span>Fator de Saúde Real:</span>
            <span id="healthFactor" class="value">-</span>
        </div>
        <div class="metric">
            <span>Status do Monitoramento:</span>
            <span id="status" class="status-badge healthy">-</span>
        </div>
        <div class="metric">
            <span>Colateral Bruto:</span>
            <span id="totalSupply" class="value">-</span>
        </div>
        <div class="metric">
            <span>Dívida Informada:</span>
            <span id="totalBorrow" class="value">-</span>
        </div>
        <div class="metric" style="color: #ff9900; border-bottom: none;">
            <span>⚠️ Alvo Real de Liquidação:</span>
            <span id="liqPrice" class="value" style="color: #ff9900;">-</span>
        </div>
    </div>
</div>

<!-- Painel visual para ler o erro exato na tela do celular -->
<div id="debugLog" class="debug-panel">Console log: Aguardando execução...</div>

<script>
const minhaCarteira = "0x49F8739791713858A6718564f035f8c35905829C";

window.onload = function() {
    sincronizarRede();
    setInterval(sincronizarRede, 25000); 
};

async function sincronizarRede() {
    const errorBanner = document.getElementById('errorBanner');
    const debugLog = document.getElementById('debugLog');
    errorBanner.style.display = 'none';
    debugLog.style.color = '#55ff55';
    debugLog.innerText = "Iniciando sincronização...";

    try {
        // 1. Busca o preço via CoinGecko
        debugLog.innerText += "\n[1/3] Buscando preço na CoinGecko...";
        const btcRes = await fetch("https://coingecko.com");
        if(!btcRes.ok) throw new Error("Falha HTTP na CoinGecko Status: " + btcRes.status);
        const btcData = await btcRes.json();
        const precoBTC = parseFloat(btcData.bitcoin.usd);
        debugLog.innerText += ` OK (U$ ${precoBTC})`;

        // 2. Conexão RPC com a rede BNB Chain
        debugLog.innerText += "\n[2/3] Conectando ao RPC da BNB Chain...";
        const provider = new ethers.providers.JsonRpcProvider("https://binance.org");
        
        const vComptrollerAbi = ["function getAccountLiquidity(address account) view returns (uint, uint, uint)"];
        const vComptrollerAddress = "0xfD36E2c2a6789Db23113685031d7F16329158384";
        const contratoVenus = new ethers.Contract(vComptrollerAddress, vComptrollerAbi, provider);

        // 3. Chamada do Contrato
        debugLog.innerText += "\n[3/3] Lendo getAccountLiquidity da Venus...";
        const liquidezDaRede = await contratoVenus.getAccountLiquidity(minhaCarteira);
        debugLog.innerText += " OK.";
        
        // Dados de posição configurados manualmente
        const quantidadeBTCB = 0.008673; 
        const dividaFixa = 318.96; 
        const fatorColateral = 0.80; 

        const colateralBruto = quantidadeBTCB * precoBTC;
        const colateralPonderado = colateralBruto * fatorColateral;
        const fatorSaudeReal = colateralPonderado / dividaFixa;
        const pontoDeQuebra = dividaFixa / (quantidadeBTCB * fatorColateral);

        document.getElementById('btcPrice').innerText = `U$ ${precoBTC.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        document.getElementById('totalSupply').innerText = `U$ ${colateralBruto.toFixed(2)}`;
        document.getElementById('totalBorrow').innerText = `U$ ${dividaFixa.toFixed(2)}`;
        document.getElementById('healthFactor').innerText = fatorSaudeReal.toFixed(2);
        document.getElementById('liqPrice').innerText = `U$ ${pontoDeQuebra.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        
        const statusBadge = document.getElementById('status');
        if (fatorSaudeReal > 1.5) {
            statusBadge.innerText = "Margem Segura";
            statusBadge.className = "status-badge healthy";
        } else {
            statusBadge.innerText = "Risco Moderado / Atenção";
            statusBadge.className = "status-badge danger";
        }

        debugLog.innerText += "\nSincronização concluída com sucesso!";

    } catch (err) {
        console.error(err);
        errorBanner.style.display = 'block';
        debugLog.style.color = '#ff5555';
        // Captura a mensagem de erro exata e joga na tela
        debugLog.innerText += "\n\n❌ ERRO DETECTADO:\n" + err.message;
        if(err.stack) {
            debugLog.innerText += "\n\nDetalhes do Erro:\n" + err.stack.split('\n')[0];
        }
    }
}
</script>

</body>
</html>
