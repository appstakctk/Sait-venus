<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Risco e Projeções - Venus</title>
    <!-- Inclui a biblioteca oficial Ethers.js para comunicação direta com a Blockchain -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #161b22;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            margin-bottom: 20px;
        }
        h2, h3 { text-align: center; color: #58a6ff; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #30363d;
            border-radius: 5px;
            background-color: #0d1117;
            color: #f0f6fc;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2ea043; }
        button:disabled { background-color: #21262d; color: #8b949e; cursor: not-allowed; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .super-safe { background-color: #238636; color: white; }
        .safe { background-color: #1f6feb; color: white; }
        .moderate { background-color: #d29922; color: black; }
        .danger { background-color: #f85149; color: white; }
        .info { font-size: 14px; color: #8b949e; margin-top: 10px; text-align: center; font-weight: bold; }
        .status-msg { font-size: 12px; color: #58a6ff; text-align: center; margin-top: -10px; margin-bottom: 15px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #30363d;
        }
        th { background-color: #21262d; color: #58a6ff; }
        tr:hover { background-color: #21262d; }
        .text-danger { color: #f85149; font-weight: bold; }
        .text-warning { color: #d29922; font-weight: bold; }
        .text-safe { color: #58a6ff; font-weight: bold; }
        .text-super-safe { color: #3fb950; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Simulador Dinâmico Venus</h2>
    
    <div class="input-group">
        <label>Endereço da Carteira BSC:</label>
        <input type="text" id="walletAddress" value="0x49F8739791713858A6718564f035f8c35905829C">
    </div>

    <button id="syncBtn" onclick="sincronizarDados()">Sincronizar Dados via Blockchain</button>
    <div id="statusMsg" class="status-msg">Pronto para sincronizar.</div>

    <div class="input-group">
        <label>Preço Atual do BTC no Mercado (US$):</label>
        <input type="text" id="btcPrice" value="60000" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Seu Saldo BTCB (Colateral):</label>
        <input type="text" id="btcBalance" value="0.010918" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Sua Dívida Total (US$):</label>
        <input type="text" id="borrow" value="393.07" oninput="calcular()">
    </div>

    <div id="result" class="result-box moderate">
        Fator de Saúde Atual: --
    </div>
    
    <div id="liquidationPrice" class="info">
        Preço limite de liquidação: US$ --
    </div>
</div>

<div class="container">
    <h3>Projeções Automáticas de Queda</h3>
    <table>
        <thead>
            <tr>
                <th>Queda</th>
                <th>Preço BTC</th>
                <th>Seu Colateral</th>
                <th>Fator Saúde</th>
            </tr>
        </thead>
        <tbody id="projectionTable">
        </tbody>
    </table>
</div>

<script>
function parseInputField(id) {
    const value = document.getElementById(id).value.toString();
    return parseFloat(value.replace(',', '.')) || 0;
}

async function sincronizarDados() {
    const wallet = document.getElementById('walletAddress').value.trim();
    const syncBtn = document.getElementById('syncBtn');
    const statusMsg = document.getElementById('statusMsg');

    if (!wallet.startsWith("0x") || wallet.length !== 42) {
        statusMsg.innerText = "Erro: Endereço de carteira inválido.";
        statusMsg.style.color = "#f85149";
        return;
    }

    syncBtn.disabled = true;
    statusMsg.innerText = "Conectando ao nó BSC e buscando dados reais...";
    statusMsg.style.color = "#58a6ff";

    try {
        // 1. Busca preço atualizado do Bitcoin via API da Binance
        const priceResponse = await fetch("https://binance.com");
        const priceData = await priceResponse.json();
        if (priceData && priceData.price) {
            const btcPrice = parseFloat(priceData.price);
            document.getElementById('btcPrice').value = btcPrice.toFixed(2);
        }

        // 2. Inicializa o provedor RPC público da BNB Chain
        const provider = new ethers.JsonRpcProvider("https://binance.org");

        // ABIs Mínimos para interagir com os contratos inteligentes da Venus
        const comptrollerAbi = ["function getAccountLiquidity(address) view returns (uint, uint, uint)"];
        const vTokenAbi = [
            "function balanceOf(address) view returns (uint)",
            "function borrowBalanceCurrent(address) view returns (uint)",
            "function exchangeRateCurrent() view returns (uint)"
        ];

        const COMPTROLLER_ADDRESS = "0xfD310710221b3302345654D9a3db199E0F2c9ae2";
        const VBTC_ADDRESS = "0x882C173bC7dF33f8A7b352057d215906D53d1000";

        const comptrollerContract = new ethers.Contract(COMPTROLLER_ADDRESS, comptrollerAbi, provider);
        const vBtcContract = new ethers.Contract(VBTC_ADDRESS, vTokenAbi, provider);

        // Busca o saldo do token vBTC do usuário na blockchain
        const vBtcBalance = await vBtcContract.balanceOf(wallet);
        
        // Busca a taxa de conversão atual do vBTC interno para o ativo real (BTCB)
        const exchangeRate = await vBtcContract.exchangeRateCurrent();

        // Converte o saldo de vBTC para a quantidade real de BTCB
        const btcBalanceUnderlying = (vBtcBalance * exchangeRate) / ethers.parseUnits("1", 18);
        const btcEstimated = Number(btcBalanceUnderlying) / 1e18;

        if (btcEstimated > 0) {
            document.getElementById('btcBalance').value = btcEstimated.toFixed(6);
        }

        // Busca a liquidez da conta (Erro, Liquidez Sobrando em USD, Déficit/Dívida em USD)
        const liquidityInfo = await comptrollerContract.getAccountLiquidity(wallet);
        const deficitUsd = Number(liquidityInfo[2]) / 1e18; 

        if (deficitUsd > 0) {
            document.getElementById('borrow').value = deficitUsd.toFixed(2);
        } else {
            const btcPriceCurrent = parseInputField('btcPrice');
            const borrowBalance = await vBtcContract.borrowBalanceCurrent(wallet);
            const borrowConverted = Number(borrowBalance) / 1e18;
            if (borrowConverted > 0) {
                document.getElementById('borrow').value = (borrowConverted * btcPriceCurrent).toFixed(2);
            }
        }

        statusMsg.innerText = "Sincronização realizada com sucesso via Ethers.js!";
        statusMsg.style.color = "#3fb950";

    } catch (error) {
        console.error(error);
        statusMsg.innerText = "Nó RPC ocupado. Usando os valores inseridos nas caixas de texto.";
        statusMsg.style.color = "#d29922";
    } finally {
        syncBtn.disabled = false;
        calcular();
    }
}

function calcular() {
    const price = parseInputField('btcPrice');
    const balance = parseInputField('btcBalance');
    const borrow = parseInputField('borrow');
    const fatorGarantia = 0.80; 
    
    if (borrow <= 0) {
        document.getElementById('result').innerText = "Fator de Saúde: ∞";
        document.getElementById('result').className = "result-box super-safe";
        document.getElementById('liquidationPrice').innerText = "Preço limite de liquidação: N/A";
        document.getElementById('projectionTable').innerHTML = "<tr><td colspan='4'>Sem dívidas para projetar risco.</td></tr>";
        return;
    }

    const colateralTotal = balance * price;
    const hfAtual = (colateralTotal * fatorGarantia) / borrow;
    const liqPrice = borrow / (balance * fatorGarantia);

    const resultDiv = document.getElementById('result');
    resultDiv.innerText = "Fator de Saúde Atual: " + hfAtual.toFixed(2);
    
    if (hfAtual >= 2.0) resultDiv.className = "result-box super-safe";
    else if (hfAtual >= 1.5) resultDiv.className = "result-box safe";
    else if (hfAtual >= 1.15) resultDiv.className = "result-box moderate";
    else resultDiv.className = "result-box danger";
