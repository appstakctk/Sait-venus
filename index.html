<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limites Dinâmicos - Pontos de risco do BTC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #0d0f12;
            border: 1px solid #1c2024;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .header-title {
            color: #6c7a89;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .header-subtitle {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
        }

        .icon-lightbulb {
            color: #5c6773;
            display: flex;
        }

        .risk-list {
            display: flex;
            flex-direction: column;
        }

        .risk-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #1c2024;
        }

        .risk-item:first-child { padding-top: 10px; }
        .risk-item:last-child { border-bottom: none; padding-bottom: 10px; }

        .risk-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .risk-bar {
            width: 4px;
            height: 36px;
            border-radius: 2px;
        }
        .bar-warning { background-color: #ffcc00; }
        .bar-high { background-color: #ff7700; }
        .bar-liquidation { background-color: #ff3355; }

        .risk-title-block { display: flex; flex-direction: column; }
        .risk-name { font-size: 18px; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
        .risk-sub { color: #5c6773; font-size: 13px; }

        .risk-right { text-align: right; display: flex; flex-direction: column; }
        .risk-price { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
        .risk-pct { color: #5c6773; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div>
                <div class="header-title">Limites Dinâmicos</div>
                <div class="header-subtitle">Pontos de risco do BTC</div>
            </div>
            <div class="icon-lightbulb">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"></path>
                    <line x1="9" y1="18" x2="15" y2="18"></line>
                    <line x1="10" y1="22" x2="14" y2="22"></line>
                </svg>
            </div>
        </div>

        <div class="risk-list">
            <!-- Item: Aviso -->
            <div class="risk-item">
                <div class="risk-left">
                    <div class="risk-bar bar-warning"></div>
                    <div class="risk-title-block">
                        <span class="risk-name">Aviso</span>
                        <span class="risk-sub">Saúde 1.40</span>
                    </div>
                </div>
                <div class="risk-right">
                    <span class="risk-price">US$ 58.402,62</span>
                    <span class="risk-pct">-10.1% do preço atual</span>
                </div>
            </div>

            <!-- Item: Risco Alto -->
            <div class="risk-item">
                <div class="risk-left">
                    <div class="risk-bar bar-high"></div>
                    <div class="risk-title-block">
                        <span class="risk-name">Risco alto</span>
                        <span class="risk-sub">Saúde 1.20</span>
                    </div>
                </div>
                <div class="risk-right">
                    <span class="risk-price">US$ 50.058,46</span>
                    <span class="risk-pct">-22.9% do preço atual</span>
                </div>
            </div>

            <!-- Item: Liquidação -->
            <div class="risk-item">
                <div class="risk-left">
                    <div class="risk-bar bar-liquidation"></div>
                    <div class="risk-title-block">
                        <span class="risk-name">Liquidação</span>
                        <span class="risk-sub">Saúde 1.00</span>
                    </div>
                </div>
                <div class="risk-right">
                    <span class="risk-price">US$ 41.714,30</span>
                    <span class="risk-pct">-35.8% do preço atual</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
