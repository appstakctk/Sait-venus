<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Liquidação - Venus Protocol Real-Time</title>
    <style>
        :root {
            --bg-color: #0d0e10;
            --card-bg: #15171a;
            --text-main: #ffffff;
            --text-muted: #5c626a;
            --text-green: #9eff00;
            --text-red: #ff3b30;
            --border-color: #1e2226;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .liquidation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .liquidation-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .liquidation-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--text-red);
            border-radius: 50%;
        }

        .badge-critical {
            background-color: rgba(255, 59, 48, 0.12);
            color: var(--text-red);
            font-size: 10px;
            font-weight: 700;
            padding: 5px 9px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .liquidation-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .market-value {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .distance-box {
            background-color: rgba(158, 255, 0, 0.02);
            border: 1px solid rgba(158, 255, 0, 0.12);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 36px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .distance-icon {
            color: var(--text-green);
            display: flex;
            align-items: center;
        }

        .distance-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .distance-percentage {
            color: var(--text-green);
            font-size: 18px;
            font-weight: 700;
        }

        .stress-test-title-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .stress-test-tag {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-green);
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .stress-test-main-title {
            font-size: 22px;
            font-weight: 700;
        }

        .lightning-icon {
            color: #2c3035;
        }

        .simulation-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .simulation-table th {
            text-align: left;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding-bottom: 16px;
            font-weight: 600;
        }

        .simulation-table th:nth-child(2) {
            text-align: right;
            padding-right: 15px;
        }

        .simulation-table th:nth-child(3) {
            text-align: right;
        }

        .simulation-table td {
            padding: 12px 0;
            vertical-align: middle;
        }

        .drop-pct {
            color: var(--text-muted);
            background-color: #1a1d20;
            padding: 8px 10px;
            border-radius: 8px;
            display: inline-block;
            font-weight: 600;
            min-width: 54px;
            text-align: center;
            font-size: 13px;
        }

        .proj-price {
            text-align: right;
            font-weight: 700;
            font-size: 15px;
            padding-right: 15px;
        }

        .health-score {
            text-align: right;
            font-weight: 600;
        }

        .health-good {
            color: #dca341;
        }

        .health-warning {
            color: #be4347;
        }

        .footer-monitor {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 16px;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #52c41a;
            border-radius: 50%;
            display: inline-block;
        }
        
        .sync-time {
            font-size: 10px;
            color: #43474e;
        }
    </style>
    <!-- Carregamento seguro da biblioteca Ethers.js -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
</head>
<body>

<div class="container">
    <div>
        <div class="liquidation-header">
            <div class="liquidation-title" id="health-header">Saúde Real: -- · Liquidação</div>
            <div class="badge-critical">CRÍTICO</div>
        </div>
        <div class="liquidation-value" id="liq-price">US$ 45.001,36</div>
        <div class="market-value" id="btc-market-price">Preço de Mercado BTC: Carregando...</div>
    </div>

    <div class="distance-box">
        <div class="distance-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        <div>
            <div class="distance-label">Distância até a liquidação</div>
            <div class="distance-percentage" id="distance-pct">--% de queda</div>
        </div>
    </div>

    <div>
        <div class="stress-test-tag">Teste de Estresse</div>
        <div class="stress-test-title-container">
            <div class="stress-test-main-title">Se o BTC cair...</div>
            <div class="lightning-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
            </div>
        </div>
    </div>

    <table class="simulation-table">
        <thead>
            <tr>
                <th style="width: 25%;">Queda</th>
                <th style="width: 55%;">Preço Projetado</th>
                <th style="width: 20%;">Saúde</th>
            </tr>
        </thead>
        <tbody id="simulation-rows">
        </tbody>
    </table>

    <div class="footer-monitor">
        <div class="status-container">
            <span class="status-dot"></span>
            <span id="wallet-label">Monitorando Venus: 0x49F87...5829C</span>
        </div>
        <div class="sync-time" id="sync-text">Última sincronização: --:--:-- · Dados via BNB Chain RPC</div>
    </div>
</div>

<script>
    // Endereço do seu portfólio fornecido na imagem
    const WALLET_ADDRESS = "0x49F8739791713858A6718564f035f8c35905829C";
    
    // Contratos Oficiais da Venus Protocol na BNB Chain (BSC)
    const VENUS_COMPTROLLER_ADDRESS = "0xfD36E2c2a6789Db23113685031d7F16329158384"; // Core Pool Comptroller
    const VENUS_BTC_ORACLE = "0x2647c68b3e82d770aa6521cf3e63914a4bf74fbf"; // Exemplo de Oracle Resiliente Venus para BTCB

    // RPC Node público e otimizado para a BNB Chain
    const BSC_RPC_URL = "https://binance.org";

    function formatarMoeda(valor) {
        return "US$ " + valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function carregarDadosVenusDeFi() {
        try {
            // Inicializa conexão criptográfica com a rede BSC
            const provider = new ethers.providers.JsonRpcProvider(BSC_RPC_URL);

            // 1. Coleta o Fator de Saúde real e a Liquidez total da conta no Comptroller da Venus
            // Assinatura da função original: getAccountLiquidity(address) -> (uint, uint, uint)
            const comptrollerAbi = ["function getAccountLiquidity(address account) view returns (uint error, uint liquidity, uint shortfall)"];
            const comptrollerContract = new ethers.Contract(VENUS_COMPTROLLER_ADDRESS, comptrollerAbi, provider);
            const accountLiquidity = await comptrollerContract.getAccountLiquidity(WALLET_ADDRESS);
            
            // Tratamento matemático DeFi clássico: conversão de colateral vs empréstimos abertos
