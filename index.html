<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Risco e Projeções - Venus Real-Time</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .status-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            background-color: #161b22;
            padding: 15px;
            border-radius: 10px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .status-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #8b949e;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        .status-text {
            font-size: 14px;
            font-weight: bold;
            color: #f0f6fc;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(63, 185, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
        }
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(31, 111, 235, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(31, 111, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(31, 111, 235, 0); }
        }
        @keyframes pulse-yellow {
            0% { box-shadow: 0 0 0 0 rgba(210, 153, 34, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(210, 153, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(210, 153, 34, 0); }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.8); transform: scale(1); }
            50% { transform: scale(1.05); }
            70% { box-shadow: 0 0 0 20px rgba(248, 81, 73, 0); }
            100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); transform: scale(1); }
        }
        .circle-super-safe { background-color: #3fb950; animation: pulse-green 2s infinite; }
        .circle-safe { background-color: #1f6feb; animation: pulse-blue 2s infinite; }
        .circle-moderate { background-color: #d29922; animation: pulse-yellow 1.5s infinite; }
        .circle-danger { background-color: #f85149; animation: pulse-red 0.8s infinite; }

        .container {
            background-color: #161b22;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        h2, h3 { text-align: center; color: #58a6ff; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #30363d;
            border-radius: 5px;
            background-color: #0d1117;
            color: #f0f6fc;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-connect {
            width: 100%;
            padding: 12px;
            background-color: #1f6feb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .btn-connect:hover { background-color: #388bfd; }
        .btn-connect:disabled { background-color: #21262d; color: #8b949e; cursor: not-allowed; }
        .wallet-connected { color: #3fb950; font-size: 13px; text-align: center; margin-top: 10px; font-weight: bold; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .super-safe { background-color: #238636; color: white; }
        .safe { background-color: #1f6feb; color: white; }
        .moderate { background-color: #d29922; color: black; }
        .danger { background-color: #f85149; color: white; }
        .info { font-size: 14px; color: #8b949e; margin-top: 10px; text-align: center; font-weight: bold; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #30363d;
        }
        th { background-color: #21262d; color: #58a6ff; }
        tr:hover { background-color: #21262d; }
        .text-danger { color: #f85149; font-weight: bold; }
        .text-warning { color: #d29922; font-weight: bold; }
        .text-safe { color: #58a6ff; font-weight: bold; }
        .text-super-safe { color: #3fb950; font-weight: bold; }
    </style>
</head>
<body>

<div class="status-header">
    <div id="topCircle" class="status-circle"></div>
    <div id="topStatusText" class="status-text">Fator Saúde: --</div>
</div>

<div class="container">
    <h2>Sincronizar Conta e Preço Real</h2>
    <div class="input-group">
        <label>Endereço da Carteira (BSC):</label>
        <input type="text" id="walletAddress" placeholder="Ex: 0x1234... ou digite sua carteira" value="0x20fC37d22869c778E530aF3f6">
    </div>
    <button class="btn-connect" id="btnFetch" onclick="buscarDadosEPrecoReal()">Carregar Dados Real-Time</button>
    <div id="walletStatus" class="wallet-connected" style="display: none;"></div>
</div>

<div class="container">
    <h2>Simulador Dinâmico Venus</h2>
    
    <div class="input-group">
        <label>Preço Atual do BTC no Mercado (US$):</label>
        <input type="number" id="btcPrice" value="61000" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Seu Saldo BTCB (Colateral):</label>
        <input type="number" id="btcBalance" value="0.001" step="0.000001" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Sua Dívida Total (US$):</label>
        <input type="number" id="borrow" value="10" step="0.01" oninput="calcular()">
    </div>

    <div id="result" class="result-box moderate">
        Fator de Saúde Atual: --
    </div>
    
    <div id="liquidationPrice" class="info">
        Preço limite de liquidação: US$ --
    </div>
</div>

<div class="container">
    <h3>Projeções Automáticas de Queda</h3>
    <table>
        <thead>
            <tr>
                <th>Queda</th>
                <th>Preço BTC</th>
                <th>Seu Colateral</th>
                <th>Fator Saúde</th>
            </tr>
        </thead>
        <tbody id="projectionTable">
        </tbody>
    </table>
</div>

<script>
const COLLATERAL_FACTOR = 0.75;

async function buscarDadosEPrecoReal() {
    const address = document.getElementById('walletAddress').value.trim();
    const btn = document.getElementById('btnFetch');
    const statusDiv = document.getElementById('walletStatus');

    if (!address.startsWith("0x") || address.length !== 42) {
        alert("Por favor, digite um endereço de carteira válido da BNB Chain (começando com 0x).");
        return;
    }

    try {
        btn.disabled = true;
        btn.innerText = "Buscando dados on-chain...";
        statusDiv.style.display = "none";

        const [priceResponse, venusResponse] = await Promise.all([
            fetch('https://binance.com'),
            fetch(`https://venus.io{address}`)
        ]);

        if (!priceResponse.ok || !venusResponse.ok) {
            throw new Error("Falha ao se conectar com os servidores da API.");
        }

        const priceData = await priceResponse.json();
        const venusData = await venusResponse.json();

        const btcMarketPrice = parseFloat(priceData.price);
        if (btcMarketPrice > 0) {
            document.getElementById('btcPrice').value = btcMarketPrice.toFixed(2);
        }

        let btcbCollateral = 0;
        let totalBorrowUsd = 0;

        if (venusData && venusData.data && venusData.data.markets) {
            const markets = venusData.data.markets;
            const vBtcContract = "0x882c173bc7ff3b7786ca16dfed3dffffb9ee7847".toLowerCase();
            
            markets.forEach(m => {
                if (m.address.toLowerCase() === vBtcContract) {
                    const supplyInUnderlying = parseFloat(m.supplyBalanceInToken);
                    if (m.collateral) {
                        btcbCollateral = supplyInUnderlying;
                    }
                }
            });
            totalBorrowUsd = parseFloat(venusData.data.totalBorrowUsd) || 0;
        }

        document.getElementById('btcBalance').value = btcbCollateral;
        document.getElementById('borrow').value = totalBorrowUsd.toFixed(2);

        const shortAddress = address.substring(0, 6) + "..." + address.substring(address.length - 4);
        statusDiv.innerText = `Preço (US$ ${btcMarketPrice.toLocaleString('pt-BR')}) e carteira ${shortAddress} sincronizados!`;
        statusDiv.style.color = "#3fb950";
        statusDiv.style.display = "block";

        calcular();

    } catch (error) {
        console.error(error);
        statusDiv.innerText = "Erro ao buscar dados atualizados de preço ou saldo.";
        statusDiv.style.color = "#f85149";
        statusDiv.style.display = "block";
    } finally {
        btn.disabled = false;
        btn.innerText = "Carregar Dados Real-Time";
