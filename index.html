<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sentinela Venus · Monitor de Risco</title>
    <meta name="description" content="Monitor em tempo real de preço, saúde e risco de liquidação de uma posição no Venus Protocol."/>
    <meta name="theme-color" content="#090c0b"/>
    
    <style>
        :root {
            --bg-primary: #090c0b;
            --bg-secondary: #111614;
            --text-primary: #ffffff;
            --text-muted: #8e9a96;
            --accent-gold: #f3ba2f;
            --accent-coral: #ff6b6b;
            --accent-green: #00e676;
            --border-color: #222a27;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .app-shell {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Topbar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            color: var(--accent-green);
        }

        .eyebrow {
            font-size: 0.75rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin: 0;
        }

        h1, h2, h3 {
            margin: 0;
        }

        h1 { font-size: 1.5rem; }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .live-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-status span {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
        }

        .audio-button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Hero */
        .hero-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .protocol-pill {
            display: inline-block;
            background: rgba(243, 186, 47, 0.1);
            color: var(--accent-gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .hero-copy h2 {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .hero-copy em {
            color: var(--accent-coral);
            font-style: normal;
        }

        .hero-copy p {
            color: var(--text-muted);
            margin-top: 15px;
        }

        .health-orbit {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--border-color);
            padding-left: 40px;
        }

        .health-center {
            text-align: center;
        }

        .health-center span {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
        }

        .health-center strong {
            font-size: 3rem;
            display: block;
            margin: 5px 0;
        }

        /* Grid de Métricas */
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .card-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card-heading small {
            margin-left: auto;
        }

        .icon-box.gold { color: var(--accent-gold); }
        .icon-box.coral { color: var(--accent-coral); }

        .metric-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .skeleton-line {
            height: 35px;
            background: linear-gradient(90deg, #161d1a 25%, #222a27 50%, #161d1a 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .metric-foot {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .metric-foot button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
        }

        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .panel-title p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .panel-title h3 {
            font-size: 1.2rem;
            margin-top: 5px;
        }

        /* Limites */
        .threshold-list, .simulation-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .threshold-row, .simulation-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
        }

        .tag {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .safe-tag { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); }
        .warning-tag { background: rgba(243, 186, 47, 0.15); color: var(--accent-gold); }
        .danger-tag { background: rgba(255, 107, 107, 0.15); color: var(--accent-coral); }

        .distance-strip {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 230, 118, 0.05);
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed rgba(0, 230, 118, 0.2);
        }

        /* Simulação */
        .simulation-head {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0 12px 10px 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .fall-badge {
            background: rgba(255, 107, 107, 0.1);
            color: var(--accent-coral);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .health-chip.neutral {
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .hero-grid, .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .health-orbit {
                border-left: none;
                border-top: 1px solid var(--border-color);
                padding-left: 0;
                padding-top: 20px;
            }
        }
    </style>
</head>
<body>

    <main class="app-shell">
        
        <!-- Header / Topbar -->
        <header class="topbar">
            <div class="brand-lockup">
                <div class="brand-mark">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-activity" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg>
                </div>
                <div>
                    <p class="eyebrow">VENUS RISK TERMINAL</p>
                    <h1>Sentinela</h1>
                </div>
            </div>
            <div class="topbar-actions">
                <div class="live-status"><span></span> AO VIVO · 15S</div>
                <button class="audio-button" type="button">
