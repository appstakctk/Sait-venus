<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento - BTC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* --- CONTAINER DOS DOIS BLOCOS SEPARADOS --- */
        .dashboard-container {
            display: flex;
            flex-direction: row; 
            flex-wrap: wrap;     
            gap: 30px;           
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;    
        }

        /* --- CARDS INDEPENDENTES --- */
        .card {
            flex: 1;
            min-width: 320px;    
            max-width: 420px;    
            padding: 24px;
            border-radius: 16px;
        }

        /* BLOCO 1: Limites de Segurança */
        .card-safety {
            background-color: #0b110a;
            border: 1px solid #1c271a;
        }

        /* BLOCO 2: Limites Dinâmicos */
        .card-risk {
            background-color: #0d0f12;
            border: 1px solid #1c2024;
        }

        /* --- CABEÇALHOS --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .card-safety .header-title { color: #7b9474; }
        .card-risk .header-title { color: #6c7a89; }

        .header-subtitle {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
        }

        /* --- ÍCONES --- */
        .icon-gauge {
            width: 20px;
            height: 20px;
            border: 2px solid #555;
            border-radius: 50%;
            border-top-color: transparent;
            transform: rotate(45deg);
            opacity: 0.7;
        }

        .icon-lightbulb {
            color: #5c6773;
            display: flex;
        }

        /* --- ESTILOS DO BLOCO 1: TIMELINE --- */
        .timeline {
            position: relative;
            padding-left: 32px;
            margin-bottom: 28px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: linear-gradient(to bottom, #99ff33 0%, #ffcc00 50%, #ff3333 100%);
        }

        .timeline-item {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .timeline-item:last-child { margin-bottom: 0; }

        .dot {
            position: absolute;
            left: -32px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #0b110a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dot::after {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .item-now .dot { border: 2px solid #99ff33; }
        .item-now .dot::after { background-color: #99ff33; }
        
        .item-warning .dot { border: 2px solid #ffcc00; }
        .item-warning .dot::after { background-color: #ffcc00; }

        .item-critical .dot { border: 2px solid #ff3355; }
        .item-critical .dot::after { background-color: #ff3355; }

        .info-block { display: flex; flex-direction: column; }
        .label { color: #667061; font-size: 13px; margin-bottom: 4px; }
        .price { font-size: 24px; font-weight: 700; color: #ffffff; }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .badge-now { background-color: #172412; color: #99ff33; }
        .badge-warning { background-color: #2b210c; color: #ffcc00; }
        .badge-critical { background-color: #2d1417; color: #ff3355; }

        .footer-box {
            background-color: #111a0e;
            border: 1px solid #1d2e19;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-shield { color: #99ff33; display: flex; }
        .footer-text { display: flex; flex-direction: column; }
        .footer-label { color: #667061; font-size: 12px; margin-bottom: 4px; }
        .footer-value { color: #99ff33; font-size: 18px; font-weight: 700; }

        /* --- ESTILOS DO BLOCO 2: LISTA DE RISCOS --- */
        .risk-list {
            display: flex;
            flex-direction: column;
        }

        .risk-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #1c2024;
        }

        .risk-item:first-child { padding-top: 10px; }
        .risk-item:last-child { border-bottom: none; padding-bottom: 10px; }

        .risk-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .risk-bar {
            width: 4px;
            height: 36px;
            border-radius: 2px;
        }
        .bar-warning { background-color: #ffcc00; }
        .bar-high { background-color: #ff7700; }
        .bar-liquidation { background-color: #ff3355; }

        .risk-title-block { display: flex; flex-direction: column; }
        .risk-name { font-size: 18px; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
        .risk-sub { color: #5c6773; font-size: 13px; }

        .risk-right { text-align: right; display: flex; flex-direction: column; }
        .risk-price { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
        .risk-pct { color: #5c6773; font-size: 13px; }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column; 
                align-items: center;
            }
            .card {
                width: 100%; 
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">

        <!-- BLOCO 1: LIMITES DE SEGURANÇA -->
        <div class="card card-safety">
            <div class="header">
                <div>
                    <div class="header-title">Limites de Segurança</div>
                    <div class="header-subtitle">Pontos de decisão</div>
                </div>
                <div class="icon-gauge"></div>
            </div>

            <div class="timeline">
                <div class="timeline-item item-now">
                    <div class="dot"></div>
                    <div class="info-block">
                        <span class="label">Preço atual</span>
                        <span class="price">US$ 65.010,22</span>
                    </div>
                    <span class="status-badge badge-now">AGORA</span>
                </div>

                <div class="timeline-item item-warning">
                    <div class="dot"></div>
                    <div class="info-block">
                        <span class="label">Saúde 1,40 · zona de atenção</span>
                        <span class="price">US$ 58.389,31</span>
                    </div>
                    <span class="status-badge badge-warning">ATENÇÃO</span>
                </div>

                <div class="timeline-item item-critical">
                    <div class="dot"></div>
                    <div class="info-block">
                        <span class="label">Saúde 1,00 · liquidação</span>
                        <span class="price">US$ 41.705,15</span>
                    </div>
                    <span class="status-badge badge-critical">CRÍTICO</span>
                </div>
            </div>

            <div class="footer-box">
                <div class="icon-shield">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <polyline points="9 11 11 13 15 9"></polyline>
                    </svg>
                </div>
                <div class="footer-text">
                    <span class="footer-label">Distância até a liquidação</span>
                    <span class="footer-value">35.8% de queda</span>
                </div>
            </div>
        </div>

        <!-- BLOCO 2: LIMITES DINÂMICOS -->
        <div class="card card-risk">
            <div class="header">
                <div>
                    <div class="header-title">Limites Dinâmicos</div>
                    <div class="header-subtitle">Pontos de risco do BTC</div>
                </div>
                <div class="icon-lightbulb">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"></path>
