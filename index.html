<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sentinela Venus · Monitor de Risco</title>
    <meta name="description" content="Monitor em tempo real de preço, saúde e risco de liquidação de uma posição no Venus Protocol."/>
    <meta name="theme-color" content="#090c0b"/>
    
    <style>
        :root {
            --bg-primary: #090c0b;
            --bg-secondary: #111614;
            --text-primary: #ffffff;
            --text-muted: #8e9a96;
            --accent-gold: #f3ba2f;
            --accent-coral: #ff6b6b;
            --accent-green: #00e676;
            --border-color: #222a27;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
        }

        .app-shell {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* Topbar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            color: var(--accent-green);
            display: flex;
            align-items: center;
        }

        .eyebrow {
            font-size: 0.65rem;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            margin: 0;
            text-transform: uppercase;
        }

        h1 { 
            font-size: 1.3rem; 
            margin: 0;
            font-weight: 700;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .live-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .live-status span {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
        }

        .audio-button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
        }

        /* Hero */
        .hero-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .protocol-pill {
            display: inline-block;
            background: rgba(243, 186, 47, 0.08);
            color: var(--accent-gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .hero-copy h2 {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.25;
            margin: 0 0 12px 0;
        }

        .hero-copy em {
            color: var(--accent-coral);
            font-style: normal;
        }

        .hero-copy p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
            line-height: 1.4;
        }

        .health-orbit {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--border-color);
            padding-left: 24px;
        }

        .health-center {
            text-align: center;
        }

        .health-center span {
            font-size: 0.65rem;
            color: var(--text-muted);
            display: block;
            letter-spacing: 0.5px;
        }

        .health-center strong {
            font-size: 2.2rem;
            display: block;
            margin: 4px 0;
            letter-spacing: 1px;
        }

        .health-center small {
            font-size: 0.65rem;
            color: var(--accent-gold);
            display: block;
        }

        /* Grid de Métricas */
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .card-heading span:not(.icon-box) {
            color: var(--text-primary);
            font-weight: 500;
        }

        .card-heading small {
            margin-left: auto;
            font-size: 0.75rem;
        }

        .icon-box {
            display: flex;
            align-items: center;
            color: var(--text-muted);
        }
        .icon-box.gold { color: var(--accent-gold); }
        .icon-box.coral { color: var(--accent-coral); }

        .metric-value {
            margin: 16px 0;
        }

        .skeleton-line {
            height: 28px;
            background: linear-gradient(90deg, #161d1a 25%, #222a27 50%, #161d1a 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
            width: 60%;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .metric-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.03);
            padding-top: 12px;
        }

        .metric-foot button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0;
        }

        /* Dashboard Planels */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        .panel-title p {
            margin: 0;
            font-size: 0.65rem;
            letter-spacing: 1px;
        }

        .panel-title h3 {
            font-size: 1.1rem;
            margin: 4px 0 0 0;
            color: var(--text-primary);
        }

        /* Listas internas */
        .threshold-list, .simulation-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .threshold-row, .simulation-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .threshold-row small {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .threshold-row strong, .simulation-row strong {
            font-size: 0.9rem;
        }

        .tag {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .safe-tag { background: rgba(0, 230, 118, 0.1); color: var(--accent-green); }
        .warning-tag { background: rgba(243, 186, 47, 0.1); color: var(--accent-gold); }
        .danger-tag { background: rgba(255, 107, 107, 0.1); color: var(--accent-coral); }

        .distance-strip {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 230, 118, 0.03);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px dashed rgba(0, 230, 118, 0.15);
            color: var(--text-muted);
        }

        .distance-strip small {
            display: block;
            font-size: 0.7rem;
        }

        .distance-strip strong {
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        /* Simulação */
        .simulation-head {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-muted);
            padding: 0 12px 8px 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .simulation-head span:nth-child(2) {
