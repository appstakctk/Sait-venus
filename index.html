<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Risco Avançada - Venus</title>
    <!-- Inclusão da Biblioteca Ethers.js para Integração Direta com a Blockchain -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #161b22;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            margin-bottom: 20px;
        }
        h2, h3 { text-align: center; color: #58a6ff; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #30363d;
            border-radius: 5px;
            background-color: #0d1117;
            color: #f0f6fc;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-api {
            width: 100%;
            padding: 10px;
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-api:hover { background-color: #30363d; }
        .btn-web3 {
            background-color: #1f6feb;
            color: white;
            border: 1px solid #388bfd;
        }
        .btn-web3:hover { background-color: #388bfd; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .safe { background-color: #1f6feb; color: white; }
        .moderate { background-color: #d29922; color: black; }
        .danger { background-color: #f85149; color: white; }
        .info { font-size: 14px; color: #8b949e; margin-top: 10px; text-align: center; font-weight: bold; }
        
        .panic-box {
            margin-top: 15px;
            padding: 15px;
            border: 1px dashed #f85149;
            background-color: rgba(248, 81, 73, 0.05);
            border-radius: 5px;
            text-align: center;
        }
        .panic-title { color: #f85149; font-weight: bold; margin-bottom: 5px; font-size: 15px; }
        .panic-value { font-size: 16px; font-weight: bold; color: #f85149; line-height: 1.5; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #30363d;
            white-space: nowrap;
        }
        th { background-color: #21262d; color: #58a6ff; }
        tr:hover { background-color: #21262d; }
        .text-danger { color: #f85149; font-weight: bold; }
        .text-warning { color: #d29922; font-weight: bold; }
        .text-safe { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Simulador Dinâmico Venus v2</h2>
    
    <button class="btn-api btn-web3" id="btnSyncWallet" onclick="sincronizarDadosRede()">🔗 Atualizar Posição Pública da Carteira</button>
    <button class="btn-api" onclick="atualizarPrecoAPI()">🔄 Sincronizar Preço Real do BTC</button>

    <div class="input-group">
        <label>Preço do BTC no Mercado (US$):</label>
        <input type="number" id="btcPrice" value="63951" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Seu Saldo BTCB (Colateral):</label>
        <input type="number" id="btcBalance" value="0.009456" step="0.000001" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Sua Dívida Total (US$):</label>
        <input type="number" id="borrow" value="338.92" step="0.01" oninput="calcular()">
    </div>

    <div id="result" class="result-box moderate">
        Fator de Saúde Atual: --
    </div>
    
    <div id="liquidationPrice" class="info">
        Preço limite de liquidação: US$ --
    </div>

    <div id="panicPanel" class="panic-box" style="display: none;">
        <div class="panic-title">🚨 MÓDULO DE CONTINGÊNCIA Ativo</div>
        <div id="panicInstruction" class="info" style="color: #c9d1d9; margin-top: 0;">Para atingir a Meta de Saúde Segura (1.50):</div>
        <div id="panicAction" class="panic-value">--</div>
    </div>
</div>

<div class="container">
    <h3>Projeções Automáticas de Queda</h3>
    <table>
        <thead>
            <tr>
                <th>Queda</th>
                <th>Preço BTC</th>
                <th>Seu Colateral</th>
                <th>Fator Saúde</th>
            </tr>
        </thead>
        <tbody id="projectionTable">
            <!-- Gerado via JavaScript Dinâmico -->
        </tbody>
    </table>
</div>

<script>
// Endereço fixado para consulta pública automática
const TARGET_WALLET = "0x49F8739791713858A6718564f035f8c35905829C";

// Contratos Oficiais dos Mercados da Venus Protocol na BNB Chain
const COMPTROLLER_ADDRESS = "0xfD36E2c2a6789Db23113685031d7F16329158384";
const VBTC_ADDRESS = "0x882C173bC7Ff3b7786CA16dfD90933a7d420955E";

// ABIs padronizadas e otimizadas para leitura direta e estável
const comptrollerAbi = ["function getAccountLiquidity(address account) view returns (uint error, uint liquidity, uint shortfall)"];
const vTokenAbi = [
    "function balanceOf(address account) view returns (uint)",
    "function borrowBalanceStored(address account) view returns (uint)",
    "function exchangeRateStored() view returns (uint)"
];

async function sincronizarDadosRede() {
    const btn = document.getElementById('btnSyncWallet');
    if (btn) btn.innerText = "⏳ Lendo Blockchain Venus...";
    
    try {
        // Conexão direta via RPC público oficial da BNB Chain
        const provider = new ethers.providers.JsonRpcProvider("https://binance.org");
        
        const vBtcContract = new ethers.Contract(VBTC_ADDRESS, vTokenAbi, provider);
        const comptrollerContract = new ethers.Contract(COMPTROLLER_ADDRESS, comptrollerAbi, provider);

        // 1. Busca os dados de fornecimento e taxa de conversão interna
        const vTokenBalance = await vBtcContract.balanceOf(TARGET_WALLET);
        const exchangeRate = await vBtcContract.exchangeRateStored();
        
        // 2. Busca o saldo real de dívida acumulada no ativo
        const dividaVTokenUSD = await vBtcContract.borrowBalanceStored(TARGET_WALLET);

        // Conversão matemática de precisão de Wei para decimal legível
        const balanceBTCB = vTokenBalance.mul(exchangeRate).div(ethers.constants.WeiPerEther);
        const btcColateralFinal = parseFloat(ethers.utils.formatUnits(balanceBTCB, 18));
        const dividaFinalUSD = parseFloat(ethers.utils.formatUnits(dividaVTokenUSD, 18));

        // Injeta os valores atualizados nos campos caso o usuário possua saldo ativo
        if (btcColateralFinal > 0) {
            document.getElementById('btcBalance').value = btcColateralFinal.toFixed(6);
        }
        if (dividaFinalUSD > 0) {
            document.getElementById('borrow').value = dividaFinalUSD.toFixed(2);
        }

        if (btn) btn.innerText = "✅ Carteira Sincronizada!";
    } catch (erro) {
        console.error("Falha na sincronização com a rede Venus:", erro);
        if (btn) btn.innerText = "❌ Erro na Rede RPC";
    } finally {
        // BLINDAGEM CONTRA TRAVAMENTOS: Força o cálculo a rodar de qualquer forma, garantindo a exibição
        calcular();
        if (btn) setTimeout(() => { btn.innerText = "🔗 Atualizar Posição Pública da Carteira"; }, 3000);
    }
}

async function atualizarPrecoAPI() {
    const btn = document.querySelector('.btn-api:not(.btn-web3)');
    if (btn) btn.innerText = "⏳ Buscando dados do mercado...";
    
    try {
        const resposta = await fetch('https://coingecko.com');
        const dados = await resposta.json();
        if(dados.bitcoin && dados.bitcoin.usd) {
            document.getElementById('btcPrice').value = dados.bitcoin.usd;
            if (btn) btn.innerText = "✅ Preço Sincronizado!";
        }
    } catch (erro) {
        console.error("Erro ao acessar API de preço:", erro);
        if (btn) btn.innerText = "❌ Erro de Conexão API";
    } finally {
        calcular();
        if (btn) setTimeout(() => { btn.innerText = "🔄 Sincronizar Preço Real do BTC"; }, 3000);
    }
}

function calcular() {
    const price = parseFloat(document.getElementById('btcPrice').value) || 0;
    const balance = parseFloat(document.getElementById('btcBalance').value) || 0;
    const borrow = parseFloat(document.getElementById('borrow').value) || 0;
    
    const factorGarantia = 0.80; // 80% LTV do ecossistema Venus
    const healthMetaSegura = 1.50; 
    
    if (borrow <= 0) {
        document.getElementById('result').innerText = "Fator de Saúde: ∞";
        document.getElementById('result').className = "result-box safe";
        document.getElementById('liquidationPrice').innerText = "Preço limite de liquidação: N/A";
        document.getElementById('projectionTable').innerHTML = "<tr><td colspan='4'>Sem dívidas para projetar risco.</td></tr>";
        document.getElementById('panicPanel').style.display = "none";
        return;
    }

    const colateralTotal = balance * price;
