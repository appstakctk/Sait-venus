<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Risco e Projeções - Venus Real-Time</title>
    <style>
        body {
            font-family: Arial, sans-serif; background-color: #0d1117; color: #c9d1d9;
            padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .container {
            background-color: #161b22; padding: 25px; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); max-width: 500px; width: 100%; margin-bottom: 20px;
        }
        h2, h3 { text-align: center; color: #58a6ff; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%; padding: 10px; border: 1px solid #30363d; border-radius: 5px;
            background-color: #0d1117; color: #f0f6fc; box-sizing: border-box; font-size: 16px;
        }
        .btn-connect {
            width: 100%; padding: 12px; background-color: #1f6feb; color: white; border: none;
            border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer;
            margin-top: 5px; transition: background 0.2s;
        }
        .btn-connect:hover { background-color: #388bfd; }
        .btn-connect:disabled { background-color: #21262d; color: #8b949e; cursor: not-allowed; }
        .wallet-connected { color: #3fb950; font-size: 13px; text-align: center; margin-top: 10px; font-weight: bold; }
        .result-box {
            margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center;
            font-size: 18px; font-weight: bold;
        }
        .super-safe { background-color: #238636; color: white; }
        .safe { background-color: #1f6feb; color: white; }
        .moderate { background-color: #d29922; color: black; }
        .danger { background-color: #f85149; color: white; }
        .info { font-size: 14px; color: #8b949e; margin-top: 10px; text-align: center; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid #30363d; }
        th { background-color: #21262d; color: #58a6ff; }
        tr:hover { background-color: #21262d; }
        .text-danger { color: #f85149; font-weight: bold; }
        .text-warning { color: #d29922; font-weight: bold; }
        .text-safe { color: #58a6ff; font-weight: bold; }
        .text-super-safe { color: #3fb950; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sincronizar Conta e Preço Real</h2>
    <div class="input-group">
        <label>Endereço da Carteira (BSC):</label>
        <input type="text" id="walletAddress" placeholder="Ex: 0x1234..." value="0x49F8739791713858A6718564f035f8c35905829C">
    </div>
    <button class="btn-connect" id="btnFetch" onclick="buscarDadosEPrecoReal()">Carregar Dados Real-Time</button>
    <div id="walletStatus" class="wallet-connected" style="display: none;"></div>
</div>

<div class="container">
    <h2>Simulador Dinâmico Venus</h2>
    <div class="input-group">
        <label>Preço Atual do BTC no Mercado (US$):</label>
        <input type="number" id="btcPrice" value="64649" oninput="calcular()">
    </div>
    <div class="input-group">
        <label>Seu Saldo BTCB (Colateral):</label>
        <input type="number" id="btcBalance" value="0.007338" step="0.000001" oninput="calcular()">
    </div>
    <div class="input-group">
        <label>Sua Dívida Total (US$):</label>
        <input type="number" id="borrow" value="214.16" step="0.01" oninput="calcular()">
    </div>

    <div id="result" class="result-box moderate">Fator de Saúde Atual: --</div>
    <div id="liquidationPrice" class="info">Preço limite de liquidação: US$ --</div>
</div>

<div class="container">
    <h3>Projeções Automáticas de Queda</h3>
    <table>
        <thead>
            <tr><th>Queda</th><th>Preço BTC</th><th>Seu Colateral</th><th>Fator Saúde</th></tr>
        </thead>
        <tbody id="projectionTable"></tbody>
    </table>
</div>
