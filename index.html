<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Saúde Financeira - Venus Protocol</title>
    <style>
        :root {
            --bg-color: #0b0f0c;
            --card-bg: #131a15;
            --text-primary: #ffffff;
            --text-secondary: #707a73;
            --accent-green: #9eff00;
            --accent-yellow: #ffd000;
            --accent-red: #ff4d4d;
            --border-color: #1f2a22;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Top Gauge Animado */
        .gauge-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 10px;
        }

        .gauge-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gauge-circle-animated {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 3px dashed var(--accent-green);
            border-radius: 50%;
            animation: rotateGauge 8s linear infinite, colorPulse 6s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(158, 255, 0, 0.2);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .gauge-content {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .gauge-label {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .gauge-value {
            font-size: 42px;
            font-weight: bold;
            color: var(--accent-green);
            margin: 5px 0;
        }

        .gauge-status {
            font-size: 10px;
            color: var(--accent-green);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        @keyframes rotateGauge {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes colorPulse {
            0% { border-color: #9eff00; box-shadow: 0 0 15px rgba(158, 255, 0, 0.4); }
            25% { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
            50% { border-color: #b600ff; box-shadow: 0 0 15px rgba(182, 0, 255, 0.4); }
            75% { border-color: #ffd000; box-shadow: 0 0 15px rgba(255, 208, 0, 0.4); }
            100% { border-color: #9eff00; box-shadow: 0 0 15px rgba(158, 255, 0, 0.4); }
        }

        /* Row Cards */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #d1d5d2;
        }

        .card-main-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-footer-data {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Decision Points Timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
            position: relative;
            padding-left: 15px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: #233026;
        }

        .timeline-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .timeline-dot {
            position: absolute;
            left: -15px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: grey;
            top: 14px;
        }

        .dot-green { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .dot-yellow { background: var(--accent-yellow); }
        .dot-red { background: var(--accent-red); }

        .timeline-info {
            display: flex;
            flex-direction: column;
        }

        .timeline-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .timeline-value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 2px;
        }

        .badge {
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-green { background: #1a2e1d; color: var(--accent-green); }
        .badge-yellow { background: #2e2a14; color: var(--accent-yellow); }
        .badge-red { background: #331414; color: var(--accent-red); }

        .alert-box {
            background-color: #162218;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .alert-box span {
            color: var(--accent-green);
            font-weight: bold;
        }

        /* Stress Test Table */
        .stress-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .stress-table th {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: left;
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .stress-table td {
            padding: 10px 0;
            font-size: 13px;
            border-bottom: 1px solid #17221a;
        }

        .stress-table tr:last-child td {
            border-bottom: none;
        }

        .col-right { text-align: right; }
        .drop-val { color: var(--text-secondary); }
        .price-val { font-weight: 600; }
        
        .health-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
        }
        .h-green { background: #1a2e1d; color: var(--accent-green); }
        .h-yellow { background: #2e2a14; color: var(--accent-yellow); }
        .h-red { background: #331414; color: var(--accent-red); }

        .footer-text {
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- Fator de Saúde com Círculo Animado -->
        <div class="gauge-container">
            <div class="gauge-wrapper">
                <div class="gauge-circle-animated"></div>
                <div class="gauge-content">
                    <span class="gauge-label">Fator de Saúde</span>
                    <span class="gauge-value" id="health-factor">1.44</span>
                    <span class="gauge-status" id="health-status">POSIÇÃO SAUDÁVEL</span>
                </div>
            </div>
        </div>

        <!-- BTC / USDT -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">🪙 BTC / USDT</div>
                <span>PERMANENTE: BTC/USDT</span>
            </div>
            <div class="card-main-value" id="btc-price">US$ 64.777,54</div>
            <div class="card-footer-data">
                <span id="market-status" style="color: var(--accent-green);">● Mercado conectado</span>
                <span>🔄</span>
            </div>
        </div>

        <!-- Colateral BTCB -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">🏦 Colateral BTCB</div>
                <span>DEPOSITADO</span>
            </div>
            <div class="card-main-value" id="collateral-crypto">0.010919 BTCB</div>
            <div class="card-footer-data">
                <span id="collateral-fiat">USD 706,42</span>
                <span id="ltv-value">LTV: 55%</span>
            </div>
        </div>

        <!-- Dívida Total -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">💼 Dívida total</div>
                <span>EMPRÉSTIMO</span>
            </div>
            <div class="card-main-value" id="total-debt">US$ 393,13</div>
            <div class="card-footer-data">
                <span>colateral ponderado</span>
                <span id="weighted-collateral">US$ 564,28</span>
            </div>
        </div>

        <!-- Limites de Segurança -->
        <div class="card">
            <div class="card-header" style="margin-bottom: 2px;">
