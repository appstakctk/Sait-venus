<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Risco Avançada - Venus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #161b22;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            margin-bottom: 20px;
        }
        h2, h3 { text-align: center; color: #58a6ff; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #30363d;
            border-radius: 5px;
            background-color: #0d1117;
            color: #f0f6fc;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-api {
            width: 100%;
            padding: 10px;
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .btn-api:hover { background-color: #30363d; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .safe { background-color: #1f6feb; color: white; }
        .moderate { background-color: #d29922; color: black; }
        .danger { background-color: #f85149; color: white; }
        .info { font-size: 14px; color: #8b949e; margin-top: 10px; text-align: center; font-weight: bold; }
        
        /* Estilos do Modo Pânico */
        .panic-box {
            margin-top: 15px;
            padding: 15px;
            border: 1px dashed #f85149;
            background-color: rgba(248, 81, 73, 0.05);
            border-radius: 5px;
            text-align: center;
        }
        .panic-title { color: #f85149; font-weight: bold; margin-bottom: 5px; font-size: 15px; }
        .panic-value { font-size: 16px; font-weight: bold; color: #f85149; line-height: 1.5; }

        /* Estilos da Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #30363d;
        }
        th { background-color: #21262d; color: #58a6ff; }
        tr:hover { background-color: #21262d; }
        .text-danger { color: #f85149; font-weight: bold; }
        .text-warning { color: #d29922; font-weight: bold; }
        .text-safe { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Simulador Dinâmico Venus v2</h2>
    
    <button class="btn-api" onclick="atualizarPrecoAPI()">🔄 Sincronizar Preço Real do BTC</button>

    <div class="input-group">
        <label>Preço do BTC no Mercado (US$):</label>
        <input type="number" id="btcPrice" value="63951" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Seu Saldo BTCB (Colateral):</label>
        <input type="number" id="btcBalance" value="0.009456" step="0.000001" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Sua Dívida Total (US$):</label>
        <input type="number" id="borrow" value="338.92" step="0.01" oninput="calcular()">
    </div>

    <div id="result" class="result-box moderate">
        Fator de Saúde Atual: --
    </div>
    
    <div id="liquidationPrice" class="info">
        Preço limite de liquidação: US$ --
    </div>

    <!-- MÓDULO ADICIONADO: Painel de Proteção contra Margens de Risco -->
    <div id="panicPanel" class="panic-box" style="display: none;">
        <div class="panic-title">🚨 MÓDULO DE CONTINGÊNCIA Ativo</div>
        <div id="panicInstruction" class="info" style="color: #c9d1d9; margin-top: 0;">Para atingir a Meta de Saúde Segura (1.50):</div>
        <div id="panicAction" class="panic-value">--</div>
    </div>
</div>

<div class="container">
    <h3>Projeções Automáticas de Queda</h3>
    <table>
        <thead>
            <tr>
                <th>Queda</th>
                <th>Preço BTC</th>
                <th>Seu Colateral</th>
                <th>Fator Saúde</th>
            </tr>
        </thead>
        <tbody id="projectionTable">
            <!-- Gerado via JavaScript -->
        </tbody>
    </table>
</div>

<script>
// CORRIGIDO: Endpoint público da API do CoinGecko para puxar a cotação real do Bitcoin
async function atualizarPrecoAPI() {
    const btn = document.querySelector('.btn-api');
    try {
        btn.innerText = "⏳ Buscando dados do mercado...";
        const resposta = await fetch('https://coingecko.com');
        const dados = await resposta.json();
        if(dados.bitcoin && dados.bitcoin.usd) {
            document.getElementById('btcPrice').value = dados.bitcoin.usd;
            btn.innerText = "✅ Sincronizado com Sucesso!";
            calcular();
            setTimeout(() => { btn.innerText = "🔄 Sincronizar Preço Real do BTC"; }, 3000);
        }
    } catch (erro) {
        console.error("Erro ao acessar API:", erro);
        btn.innerText = "❌ Erro de Conexão. Tente mais tarde.";
        setTimeout(() => { btn.innerText = "🔄 Sincronizar Preço Real do BTC"; }, 4000);
    }
}

function calcular() {
    const price = parseFloat(document.getElementById('btcPrice').value) || 0;
    const balance = parseFloat(document.getElementById('btcBalance').value) || 0;
    const borrow = parseFloat(document.getElementById('borrow').value) || 0;
    
    const fatorGarantia = 0.80; // 80% LT real do painel Venus
    const healthMetaSegura = 1.50; 
    
    if (borrow <= 0) {
        document.getElementById('result').innerText = "Fator de Saúde: ∞";
        document.getElementById('result').className = "result-box safe";
        document.getElementById('liquidationPrice').innerText = "Preço limite de liquidação: N/A";
        document.getElementById('projectionTable').innerHTML = "<tr><td colspan='4'>Sem dívidas para projetar risco.</td></tr>";
        document.getElementById('panicPanel').style.display = "none";
        return;
    }

    const colateralTotal = balance * price;
    const hfAtual = (colateralTotal * fatorGarantia) / borrow;
    const liqPrice = borrow / (balance * fatorGarantia);

    const resultDiv = document.getElementById('result');
    resultDiv.innerText = "Fator de Saúde Atual: " + hfAtual.toFixed(2);
    
    if (hfAtual >= 1.5) resultDiv.className = "result-box safe";
    else if (hfAtual >= 1.15) resultDiv.className = "result-box moderate";
    else resultDiv.className = "result-box danger";

    document.getElementById('liquidationPrice').innerText = "Preço limite de liquidação: US$ " + Math.round(liqPrice).toLocaleString('pt-BR');

    // LOGICA DO MÓDULO DE PÂNICO: Dispara automaticamente caso o Fator de Saúde esteja abaixo de 1.50
    const panicPanel = document.getElementById('panicPanel');
    if (hfAtual < healthMetaSegura) {
        panicPanel.style.display = "block";
        
        // 1. Quanto de dívida amortizar para reajustar o Fator de Saúde para 1.50
        const dividaMaxAlvo = (colateralTotal * fatorGarantia) / healthMetaSegura;
        const pagarUSD = borrow - dividaMaxAlvo;
        
        // 2. Quanto de BTC depositar para reajustar o Fator de Saúde para 1.50 mantendo a dívida igual
        const colateralAlvoUSD = (borrow * healthMetaSegura) / fatorGarantia;
        const depositarUSD = colateralAlvoUSD - colateralTotal;
        const depositarBTC = price > 0 ? (depositarUSD / price) : 0;

        document.getElementById('panicAction').innerHTML = 
            `Amortizar a dívida em: <span class="text-danger">US$ ${pagarUSD.toFixed(2)}</span><br>` +
            `OU<br>` +
            `Depositar colateral: <span class="text-safe">${depositarBTC.toFixed(6)} BTC</span> (~US$ ${depositarUSD.toFixed(2)})`;
    } else {
        panicPanel.style.display = "none";
    }

    // GERAÇÃO DA TABELA DE PROJEÇÕES AUTOMÁTICAS DE QUEDA
    const quedas = [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50];
    let tabelaHTML = "";

    quedas.forEach(queda => {
        const precoProjetado = price * (1 - queda);
        const colateralProjetado = balance * precoProjetado;
        const hfProjetado = (colateralProjetado * fatorGarantia) / borrow;

        let classeStatus = "text-safe";
        if (hfProjetado < 1.15) {
            classeStatus = "text-danger";
        } else if (hfProjetado < 1.50) {
            classeStatus = "text-warning";
        }

        tabelaHTML += `
            <tr>
                <td>${queda * 100}%</td>
                <td>US$ ${Math.round(precoProjetado).toLocaleString('pt-BR')}</td>
                <td>US$ ${colateralProjetado.toFixed(2)}</td>
                <td class="${classeStatus}">${hfProjetado.toFixed(2)}</td>
            </tr>
        `;
    });

    document.getElementById('projectionTable').innerHTML = tabelaHTML;
}

// Executa o cálculo inicial assim que carregar as janelas da página
window.onload = function() {
    calcular();
};
</script>
</body>
</html>
