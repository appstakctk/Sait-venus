<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Risco Avançada - Venus</title>
    <!-- Inclusão da Biblioteca Ethers.js para Integração Web3 com a BNB Chain -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #161b22;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            margin-bottom: 20px;
        }
        h2, h3 { text-align: center; color: #58a6ff; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #30363d;
            border-radius: 5px;
            background-color: #0d1117;
            color: #f0f6fc;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-api {
            width: 100%;
            padding: 10px;
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-api:hover { background-color: #30363d; }
        .btn-web3 {
            background-color: #238636;
            color: white;
            border: 1px solid #2ea44f;
        }
        .btn-web3:hover { background-color: #2ea44f; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .safe { background-color: #1f6feb; color: white; }
        .moderate { background-color: #d29922; color: black; }
        .danger { background-color: #f85149; color: white; }
        .info { font-size: 14px; color: #8b949e; margin-top: 10px; text-align: center; font-weight: bold; }
        
        .panic-box {
            margin-top: 15px;
            padding: 15px;
            border: 1px dashed #f85149;
            background-color: rgba(248, 81, 73, 0.05);
            border-radius: 5px;
            text-align: center;
        }
        .panic-title { color: #f85149; font-weight: bold; margin-bottom: 5px; font-size: 15px; }
        .panic-value { font-size: 16px; font-weight: bold; color: #f85149; line-height: 1.5; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #30363d;
            white-space: nowrap;
        }
        th { background-color: #21262d; color: #58a6ff; }
        tr:hover { background-color: #21262d; }
        .text-danger { color: #f85149; font-weight: bold; }
        .text-warning { color: #d29922; font-weight: bold; }
        .text-safe { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Simulador Dinâmico Venus v2</h2>
    
    <button class="btn-api btn-web3" id="btnConnect" onclick="conectarCarteira()">🦊 Conectar Carteira Web3 (Venus)</button>
    <button class="btn-api" onclick="atualizarPrecoAPI()">🔄 Sincronizar Preço Real do BTC</button>

    <div class="input-group">
        <label>Preço do BTC no Mercado (US$):</label>
        <input type="number" id="btcPrice" value="63951" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Seu Saldo BTCB (Colateral):</label>
        <input type="number" id="btcBalance" value="0.009456" step="0.000001" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Sua Dívida Total (US$):</label>
        <input type="number" id="borrow" value="338.92" step="0.01" oninput="calcular()">
    </div>

    <div id="result" class="result-box moderate">
        Fator de Saúde Atual: --
    </div>
    
    <div id="liquidationPrice" class="info">
        Preço limite de liquidação: US$ --
    </div>

    <div id="panicPanel" class="panic-box" style="display: none;">
        <div class="panic-title">🚨 MÓDULO DE CONTINGÊNCIA Ativo</div>
        <div id="panicInstruction" class="info" style="color: #c9d1d9; margin-top: 0;">Para atingir a Meta de Saúde Segura (1.50):</div>
        <div id="panicAction" class="panic-value">--</div>
    </div>
</div>

<div class="container">
    <h3>Projeções Automáticas de Queda</h3>
    <table>
        <thead>
            <tr>
                <th>Queda</th>
                <th>Preço BTC</th>
                <th>Seu Colateral</th>
                <th>Fator Saúde</th>
            </tr>
        </thead>
        <tbody id="projectionTable">
            <!-- Gerado via JavaScript Dinâmico -->
        </tbody>
    </table>
</div>

<script>
// Contratos Oficiais da Venus Protocol na BNB Chain para a leitura automatizada dos saldos
const COMPTROLLER_ADDRESS = "0xfD36E2c2a6789Db23113685031d7F16329158384";
const VBTC_ADDRESS = "0x882C173bC7Ff3b7786CA16dfD90933a7d420955E";

// ABIs mínimas necessárias para interagir com os smart contracts do protocolo
const comptrollerAbi = ["function getAccountLiquidity(address account) view returns (uint, uint, uint)"];
const vTokenAbi = [
    "function balanceOfSnapshot(address account) view returns (uint, uint, uint, uint)",
    "function borrowBalanceStored(address account) view returns (uint)"
];

async function conectarCarteira() {
    const btn = document.getElementById('btnConnect');
    if (typeof window.ethereum === 'undefined') {
        alert('Por favor, utilize um navegador Web3 ou instale a extensão MetaMask/Trust Wallet.');
        return;
    }
    
    try {
        btn.innerText = "⏳ Conectando...";
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = provider.getSigner();
        const walletAddress = await signer.getAddress();
        
        btn.innerText = `✅ Conectado: ${walletAddress.substring(0,6)}...${walletAddress.substring(38)}`;
        btn.className = "btn-api"; // remove cor verde de desconectado
        
        await buscarDadosVenus(provider, walletAddress);
    } catch (erro) {
        console.error(erro);
        btn.innerText = "❌ Erro ao conectar carteira.";
        setTimeout(() => { btn.innerText = "🦊 Conectar Carteira Web3 (Venus)"; }, 3000);
    }
}

async function buscarDadosVenus(provider, walletAddress) {
    try {
        // Conexão com os contratos da rede através da carteira injetada
        const vBtcContract = new ethers.Contract(VBTC_ADDRESS, vTokenAbi, provider);
        const comptrollerContract = new ethers.Contract(COMPTROLLER_ADDRESS, comptrollerAbi, provider);

        // 1. Busca os saldos internos de fornecimento (Snapshot)
        const snapshot = await vBtcContract.balanceOfSnapshot(walletAddress);
        const vTokenBalance = snapshot[1]; 
        const exchangeRate = snapshot[3];
        
        // Conversão matemática estrutural de Wei para unidades legíveis do Token BTCB fornecido
        const balanceBTCB = (vTokenBalance.mul(exchangeRate).div(ethers.constants.WeiPerEther)).toString();
        const btcColateralFinal = parseFloat(ethers.utils.formatUnits(balanceBTCB, 18));

        // 2. Busca a dívida total direta da conta do usuário em dólares (Liquidez do Comptroller)
        const liquidez = await comptrollerContract.getAccountLiquidity(walletAddress);
        const dividaTotalUSD = parseFloat(ethers.utils.formatUnits(liquidez[2], 18)); 

        // Atualiza a árvore DOM com os dados dinâmicos extraídos diretamente da rede BNB chain
        if(btcColateralFinal > 0) {
            document.getElementById('btcBalance').value = btcColateralFinal.toFixed(6);
        }
        document.getElementById('borrow').value = dividaTotalUSD.toFixed(2);

        // Dispara o motor de cálculos nativo
        calcular();
    } catch (erro) {
        console.error("Falha ao sincronizar dados da carteira na Blockchain:", erro);
        alert("Erro ao ler os dados do Venus Protocol. Verifique se está conectado na rede BNB Chain.");
    }
}

async function atualizarPrecoAPI() {
    const btn = document.querySelector('.btn-api:not(.btn-web3)');
    try {
        btn.innerText = "⏳ Buscando dados do mercado...";
        const resposta = await fetch('https://coingecko.com');
        const dados = await resposta.json();
        if(dados.bitcoin && dados.bitcoin.usd) {
            document.getElementById('btcPrice').value = dados.bitcoin.usd;
            btn.innerText = "✅ Sincronizado com Sucesso!";
            calcular();
            setTimeout(() => { btn.innerText = "🔄 Sincronizar Preço Real do BTC"; }, 3000);
        }
    } catch (erro) {
        console.error("Erro ao acessar API:", erro);
        btn.innerText = "❌ Erro de Conexão. Tente mais tarde.";
        setTimeout(() => { btn.innerText = "🔄 Sincronizar Preço Real do BTC"; }, 4000);
    }
}

function calcular() {
    const price = parseFloat(document.getElementById('btcPrice').value) || 0;
    const balance = parseFloat(document.getElementById('btcBalance').value) || 0;
    const borrow = parseFloat(document.getElementById('borrow').value) || 0;
    
    const fatorGarantia = 0.80; 
    const healthMetaSegura = 1.50; 
    
    if (borrow <= 0) {
