    <!-- SCRIPT CORRIGIDO: Fontes de dados alternativas de alta estabilidade -->
    <script>
        const walletAddress = "0x49F8739791713858A6718564f035f8c35905829C";

        // Função isolada para o Bitcoin (Usando a API estável da CoinDesk)
        async function loadBitcoinPrice() {
            try {
                const response = await fetch("https://coindesk.com");
                if (!response.ok) throw new Error("Erro na requisição");
                
                const data = await response.json();
                const btcPrice = data.bpi.USD.rate_float;

                // Atualiza o topo com o preço atual do Bitcoin
                document.getElementById("btc-live-price").innerText = `BTC Atual: ${btcPrice.toLocaleString('en-US', { style: 'currency', currency: 'USD' })}`;

                // Calcula os pontos de risco dinâmicos baseados no preço ativo
                const warningPrice = btcPrice * (1 - 0.023);
                const highPrice = btcPrice * (1 - 0.163);
                const liqPrice = btcPrice * (1 - 0.302);

                // Imprime os valores calculados nos respectivos campos
                document.getElementById("price-warning").innerText = warningPrice.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
                document.getElementById("price-high").innerText = highPrice.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
                document.getElementById("price-liq").innerText = liqPrice.toLocaleString('en-US', { style: 'currency', currency: 'USD' });

            } catch (error) {
                console.error("Falha ao monitorar BTC:", error);
                document.getElementById("btc-live-price").innerText = "Erro ao sincronizar preço";
            }
        }

        // Função isolada para o saldo da carteira (API pública BSCScan)
        async function loadWalletBalance() {
            try {
                const response = await fetch(`https://bscscan.com{walletAddress}&tag=latest`);
                const data = await response.json();
                
                if (data.status === "1") {
                    const balanceInBNB = parseFloat(data.result) / 1000000000000000000;
                    document.getElementById("wallet-balance").innerText = `${balanceInBNB.toFixed(4)} BNB`;
                } else {
                    document.getElementById("wallet-balance").innerText = "0.0000 BNB";
                }
            } catch (error) {
                console.error("Falha ao ler saldo:", error);
                document.getElementById("wallet-balance").innerText = "Indisponível";
            }
        }

        // Executa as duas consultas de forma independente assim que a tela abre
        window.addEventListener("DOMContentLoaded", () => {
            loadBitcoinPrice();
            loadWalletBalance();
        });
    </script>
