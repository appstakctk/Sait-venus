<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Dinâmico Venus</title>
    <style>
        :root {
            --bg-color: #0c1017;
            --card-bg: #131924;
            --text-primary: #ffffff;
            --text-secondary: #7fa3c7;
            --accent-orange: #f2a900;
            --accent-blue: #2f80ed;
            --border-color: #243145;
            --input-bg: #090d14;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            color: var(--accent-blue);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 12px;
            color: #a0aec0;
            font-weight: 500;
        }

        .input-group input {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-orange);
        }

        .health-banner {
            background-color: var(--accent-orange);
            color: #000000;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .liquidation-text {
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 10px;
        }

        /* Estilos da Tabela */
        .stress-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .stress-table th {
            color: var(--text-secondary);
            font-size: 11px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            text-transform: capitalize;
            font-weight: 600;
        }

        .stress-table td {
            padding: 10px 4px;
            border-bottom: 1px solid #1a2436;
            vertical-align: middle;
        }

        .stress-table tr:last-child td {
            border-bottom: none;
        }

        .text-center { text-align: center; }
        .text-right { text-align: right; }

        .cell-price {
            font-weight: bold;
            white-space: pre-line;
            line-height: 1.3;
        }

        .cell-health {
            font-weight: bold;
            color: #4cd964;
        }

        .row-liq {
            background-color: #2c1616;
        }
        .row-liq td {
            color: #ff3b30 !important;
        }
        .row-liq .cell-health {
            color: #ff3b30 !important;
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- Bloco 1: Simulador Dinâmico -->
        <div class="card">
            <h2>Simulador Dinâmico Venus</h2>
            
            <div class="input-group">
                <label>Preço Atual do BTC no Mercado (US$):</label>
                <input type="number" id="input-btc-price" value="64743" step="any">
            </div>

            <div class="input-group">
                <label>Seu Saldo BTCB (Colateral):</label>
                <input type="text" id="input-collateral" value="0,010918">
            </div>

            <div class="input-group">
                <label>Sua Dívida Total (US$):</label>
                <input type="text" id="input-debt" value="393,07">
            </div>

            <div class="health-banner" id="banner-health">
                Fator de Saúde Atual: 1.44
            </div>

            <div class="liquidation-text">
                Preço limite de liquidação: <span id="text-liq-price">US$ 45.003</span>
            </div>
        </div>

        <!-- Bloco 2: Projeções de Queda -->
        <div class="card">
            <h2>Projeções Automáticas de Queda</h2>
            
            <table class="stress-table">
                <thead>
                    <tr>
                        <th width="15%">Queda</th>
                        <th width="30%" class="text-center">Preço BTC</th>
                        <th width="35%" class="text-center">Seu Colateral</th>
                        <th width="20%" class="text-right">Fator Saúde</th>
                    </tr>
                </thead>
                <tbody id="projection-table-body">
                    <!-- Gerado de forma reativa pelo JavaScript -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // Função auxiliar para padronizar inputs com vírgula ou ponto
        function parseInputFloat(val) {
            if (!val) return 0;
            let clean = val.toString().replace(/\s/g, '').replace(',', '.');
            return parseFloat(clean) || 0;
        }

        function formatCurrency(val) {
            return Number(val).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        function formatDecimal(val) {
            return Number(val).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function calculateSimulations() {
            // Captura valores dos inputs em tempo real
            const btcPrice = parseInputFloat(document.getElementById('input-btc-price').value);
            const collateral = parseInputFloat(document.getElementById('input-collateral').value);
            const debt = parseInputFloat(document.getElementById('input-debt').value);

            // Regras matemáticas base do Venus Protocol (LTV Máximo Ponderado de ~60% para BTCB)
            const liquidationThreshold = 0.60; 
            
            // Fator de saúde = (Valor do Colateral * Proporção de Liquidação) / Dívida
            let currentCollateralValue = collateral * btcPrice;
            let currentHealth = debt > 0 ? (currentCollateralValue * liquidationThreshold) / debt : 0;
            
            // Preço de liquidação acontece quando o Fator de Saúde atinge exatamente 1.00
            let liquidationPrice = currentHealth > 0 ? btcPrice / currentHealth : 0;

            // Atualiza os indicadores visuais do Bloco Superior
            document.getElementById('banner-health').innerText = `Fator de Saúde Atual: ${currentHealth > 0 ? currentHealth.toFixed(2) : '0.00'}`;
            document.getElementById('text-liq-price').innerText = `US$ ${formatCurrency(liquidationPrice)}`;

            // Listagem exata das porcentagens de queda da imagem enviado
            const steps = [0, -1, -2, -3, -4, -5, -10, -15, -20, -25, -26, -27, -28, -29, -30];
            const tableBody = document.getElementById('projection-table-body');
            tableBody.innerHTML = "";

            steps.forEach(drop => {
                let factor = (1 + drop / 100);
                let projPrice = btcPrice * factor;
                let projCollateralValue = collateral * projPrice;
                let projHealth = debt > 0 ? (projCollateralValue * liquidationThreshold) / debt : 0;

                // Define as cores dinâmicas das fontes do Fator de Saúde baseadas no risco
                let healthColor = "#4cd964"; // Verde padrão
                if (projHealth <= 1.1) healthColor = "#ff3b30"; // Vermelho crítico
                else if (projHealth <= 1.3) healthColor = "#ffcc00"; // Amarelo atenção

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center" style="color: #7fa3c7;">${drop}%</td>
                    <td class="text-center cell-price">US$<br>${formatCurrency(projPrice)}</td>
                    <td class="text-center" style="color: #a0aec0;">US$ ${formatDecimal(projCollateralValue)}</td>
                    <td class="text-right cell-health" style="color: ${healthColor};">${projHealth > 0 ? projHealth.toFixed(2) : '0.00'}</td>
                `;
                tableBody.appendChild(tr);
            });

            // Insere a última linha crítica de LIQUIDAÇÃO (LIQ. 1.00)
            let liqCollateralValue = collateral * liquidationPrice;
            const trLiq = document.createElement('tr');
            trLiq.className = "row-liq";
            trLiq.innerHTML = `
                <td class="text-center" style="font-weight: bold;">LIQ.</td>
                <td class="text-center cell-price">US$<br>${formatCurrency(liquidationPrice)}</td>
                <td class="text-center" style="font-weight: bold;">US$ ${formatDecimal(liqCollateralValue)}</td>
                <td class="text-right cell-health">1.00</td>
            `;
            tableBody.appendChild(trLiq);
        }

        // Ativa os ouvintes de evento para recalcular ao digitar
        document.getElementById('input-btc-price').addEventListener('input', calculateSimulations);
