<script>
// Alvo fixado com o endereço fornecido
const TARGET_WALLET = "0x49F8739791713858A6718564f035f8c35905829C";

// Endereços de Contrato da Venus Protocol na BNB Chain
const COMPTROLLER_ADDRESS = "0xfD36E2c2a6789Db23113685031d7F16329158384";
const VBTC_ADDRESS = "0x882C173bC7Ff3b7786CA16dfD90933a7d420955E";

// ABIs estruturadas de leitura pública
const comptrollerAbi = ["function getAccountLiquidity(address account) view returns (uint error, uint liquidity, uint shortfall)"];
const vTokenAbi = [
    "function balanceOfSnapshot(address account) view returns (uint error, uint vTokenBalance, uint borrowBalance, uint exchangeRate)"
];

// FUNÇÃO PRINCIPAL: Busca dados reais da carteira na BNB Chain de forma assíncrona
async function sincronizarDadosRede() {
    const btn = document.getElementById('btnSyncWallet');
    if (btn) btn.innerText = "⏳ Lendo Blockchain Venus...";
    
    try {
        // Conexão por RPC público estável para ler os dados sem travar a página
        const provider = new ethers.providers.JsonRpcProvider("https://binance.org");
        
        const vBtcContract = new ethers.Contract(VBTC_ADDRESS, vTokenAbi, provider);
        const comptrollerContract = new ethers.Contract(COMPTROLLER_ADDRESS, comptrollerAbi, provider);

        // Executa a leitura estruturada dos blocos na blockchain
        const snapshot = await vBtcContract.balanceOfSnapshot(TARGET_WALLET);
        const vTokenBalance = snapshot.vTokenBalance; 
        const exchangeRate = snapshot.exchangeRate;
        const dividaVTokenUSD = snapshot.borrowBalance; 

        // Conversão matemática estrutural de Wei para unidades legíveis
        const balanceBTCB = vTokenBalance.mul(exchangeRate).div(ethers.constants.WeiPerEther);
        const btcColateralFinal = parseFloat(ethers.utils.formatUnits(balanceBTCB, 18));
        const dividaFinalUSD = parseFloat(ethers.utils.formatUnits(dividaVTokenUSD, 18));

        // Atualização da árvore DOM apenas se os valores retornados forem válidos
        if (btcColateralFinal > 0) {
            document.getElementById('btcBalance').value = btcColateralFinal.toFixed(6);
        }
        if (dividaFinalUSD > 0) {
            document.getElementById('borrow').value = dividaFinalUSD.toFixed(2);
        }

        if (btn) {
            btn.innerText = "✅ Carteira Sincronizada!";
            setTimeout(() => { btn.innerText = "🔗 Atualizar Posição Pública da Carteira"; }, 3000);
        }
        
        // Recalcula o painel com os novos dados inseridos
        calcular();
    } catch (erro) {
        console.error("Falha ao sincronizar dados da Blockchain:", erro);
        if (btn) {
            btn.innerText = "❌ Erro de Conexão RPC";
            setTimeout(() => { btn.innerText = "🔗 Atualizar Posição Pública da Carteira"; }, 3000);
        }
    }
}

// Busca a cotação ao vivo via API pública CoinGecko de forma isolada
async function atualizarPrecoAPI() {
    const btn = document.querySelector('.btn-api:not(.btn-web3)');
    if (btn) btn.innerText = "⏳ Buscando dados do mercado...";
    
    try {
        const resposta = await fetch('https://coingecko.com');
        const dados = await resposta.json();
        if(dados.bitcoin && dados.bitcoin.usd) {
            document.getElementById('btcPrice').value = dados.bitcoin.usd;
            if (btn) btn.innerText = "✅ Preço Sincronizado!";
            calcular();
            setTimeout(() => { if (btn) btn.innerText = "🔄 Sincronizar Preço Real do BTC"; }, 3000);
        }
    } catch (erro) {
        console.error("Erro ao acessar API de preço:", erro);
        if (btn) {
            btn.innerText = "❌ Erro de Conexão API";
            setTimeout(() => { btn.innerText = "🔄 Sincronizar Preço Real do BTC"; }, 4000);
        }
    }
}

// MOTOR MATEMÁTICO: Síncrono e isolado para garantir renderização imediata do Fator de Saúde
function calcular() {
    const price = parseFloat(document.getElementById('btcPrice').value) || 0;
    const balance = parseFloat(document.getElementById('btcBalance').value) || 0;
    const borrow = parseFloat(document.getElementById('borrow').value) || 0;
    
    const fatorGarantia = 0.80; // 80% LTV real da Venus
    const healthMetaSegura = 1.50; 
    
    if (borrow <= 0) {
        document.getElementById('result').innerText = "Fator de Saúde: ∞";
        document.getElementById('result').className = "result-box safe";
        document.getElementById('liquidationPrice').innerText = "Preço limite de liquidação: N/A";
        document.getElementById('projectionTable').innerHTML = "<tr><td colspan='4'>Sem dívidas para projetar risco.</td></tr>";
        document.getElementById('panicPanel').style.display = "none";
        return;
    }

    const colateralTotal = balance * price;
    const hfAtual = (colateralTotal * fatorGarantia) / borrow;
    const liqPrice = borrow / (balance * fatorGarantia);

    const resultDiv = document.getElementById('result');
    resultDiv.innerText = "Fator de Saúde Atual: " + hfAtual.toFixed(2);
    
    if (hfAtual >= 1.5) resultDiv.className = "result-box safe";
    else if (hfAtual >= 1.15) resultDiv.className = "result-box moderate";
    else resultDiv.className = "text-danger result-box danger";

    document.getElementById('liquidationPrice').innerText = "Preço limite de liquidação: US$ " + Math.round(liqPrice).toLocaleString('pt-BR');

    // LÓGICA DO MÓDULO DE CONTINGÊNCIA
    const panicPanel = document.getElementById('panicPanel');
    if (hfAtual < healthMetaSegura) {
        panicPanel.style.display = "block";
        
        const dividaMaxAlvo = (colateralTotal * fatorGarantia) / healthMetaSegura;
        const pagarUSD = borrow - dividaMaxAlvo;
        
        const colateralAlvoUSD = (borrow * healthMetaSegura) / fatorGarantia;
        const depositarUSD = colateralAlvoUSD - colateralTotal;
        const depositarBTC = price > 0 ? (depositarUSD / price) : 0;

        document.getElementById('panicAction').innerHTML = 
            `Amortizar a dívida em: <span class="text-danger">US$ ${pagarUSD.toFixed(2)}</span><br>` +
            `OU<br>` +
            `Depositar colateral: <span class="text-safe">${depositarBTC.toFixed(6)} BTC</span> (~US$ ${depositarUSD.toFixed(2)})`;
    } else {
        panicPanel.style.display = "none";
    }

    // GERAÇÃO DINÂMICA DA TABELA DE PROJEÇÕES
    const quedas = [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50];
    let tabelaHTML = "";

    quedas.forEach(queda => {
        const precoProjetado = Math.round(price * (1 - queda));
        const colateralProjetado = balance * precoProjetado;
        const hfProjetado = (colateralProjetado * fatorGarantia) / borrow;

        let classeStatus = "text-safe";
        if (hfProjetado < 1.15) {
            classeStatus = "text-danger";
        } else if (hfProjetado < 1.50) {
            classeStatus = "text-warning";
        }

        tabelaHTML += `
            <tr>
                <td>${queda * 100}%</td>
                <td>US$ ${precoProjetado.toLocaleString('pt-BR')}</td>
                <td>US$ ${colateralProjetado.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td class="${classeStatus}">${hfProjetado.toFixed(2)}</td>
            </tr>
        `;
    });

    document.getElementById('projectionTable').innerHTML = tabelaHTML;
}

// INICIALIZADOR SEGURO: Carrega a matemática local primeiro e ativa as rotinas automáticas de rede
window.onload = function() {
    // 1. Roda os cálculos com os números padrão salvos no HTML imediatamente
    calcular();
    
    // 2. Faz a primeira busca online de preço e carteira de fundo
    atualizarPrecoAPI();
    sincronizarDadosRede();
    
    // 3. LOOP AUTOMÁTICO: Atualiza a cada 60 segundos (60000ms) sem travar a interface
    setInterval(() => {
        atualizarPrecoAPI();
        sincronizarDadosRede();
    }, 60000);
};
</script>
